{% extends "base.html" %}{% block content %}<h2>الطلبات والتخصيص</h2><section class="card"><h3>طلب جديد</h3><form method="post" action="/admin/orders"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>مرجع الطلب<input name="external_reference" required maxlength="120"></label><label>العميل<select name="customer_id">{% for c in customers %}<option value="{{ c.id }}">{{ c.display_name }}</option>{% endfor %}</select></label><button>إضافة</button></form></section>
<section class="card"><h3>تخصيص حساب</h3><form method="post" action="/admin/assignments"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>الطلب<select name="order_id">{% for o in orders %}<option value="{{ o.id }}">{{ o.external_reference }}</option>{% endfor %}</select></label><label>الحساب<select name="account_id">{% for a in assignable_accounts %}<option value="{{ a.id }}">{{ a.identifier }}</option>{% endfor %}</select></label><label>سبب إعادة التخصيص (فقط عند الحاجة)<input name="reassign_reason" maxlength="250"></label><button>تخصيص</button></form></section>
<section class="card"><table><thead><tr><th>المرجع</th><th>العميل</th><th>الحالة</th><th>الرابط الموحد</th></tr></thead><tbody>{% for o in orders %}<tr><td>{{ o.external_reference }}</td><td>{{ o.customer_name }}</td><td>{{ o.status }}</td><td><form method="post" action="/admin/orders/{{ o.id }}/activation"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button>عرض الرابط</button></form></td></tr>{% else %}<tr><td colspan="4">لا توجد طلبات</td></tr>{% endfor %}</tbody></table></section>{% endblock %}

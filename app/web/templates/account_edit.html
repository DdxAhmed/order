{% extends "base.html" %}
{% block content %}
<h2>تعديل الحساب</h2>
<section class="card">
  <form method="post" action="/admin/accounts/{{ account.id }}/edit">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>المنصة<select name="platform_id">{% for p in platforms %}<option value="{{ p.id }}" {% if p.id == account.platform_id %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select></label>
    <label>معرف الحساب<input name="identifier" value="{{ account.identifier }}" required maxlength="255"></label>
    <label>صندوق البريد<select name="mailbox_id">{% for m in mailboxes %}<option value="{{ m.id }}" {% if m.id == account.mailbox_id %}selected{% endif %}>{{ m.label }}</option>{% endfor %}</select></label>
    {% if account.status == 'assigned' %}
      <p class="muted">حالة الإتاحة: مخصص لطلب حالي. لا يمكن تغييرها من هنا قبل إلغاء التخصيص أو إعادة التخصيص.</p>
    {% else %}
      <label>حالة الإتاحة<select name="status">
        <option value="available" {% if account.status == 'available' %}selected{% endif %}>متاح</option>
        <option value="reserved" {% if account.status == 'reserved' %}selected{% endif %}>محجوز</option>
        <option value="disabled" {% if account.status == 'disabled' %}selected{% endif %}>موقوف</option>
        <option value="archived" {% if account.status == 'archived' %}selected{% endif %}>مؤرشف</option>
      </select></label>
    {% endif %}
    <label>ملاحظات<textarea name="notes">{{ account.notes or '' }}</textarea></label>
    <button>حفظ</button>
  </form>
</section>
{% endblock %}

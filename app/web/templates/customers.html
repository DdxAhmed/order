{% extends "base.html" %}{% block content %}<h2>العملاء</h2><section class="card"><form method="post" action="/admin/customers"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>الاسم<input name="display_name" required maxlength="160"></label><label>ملاحظات<textarea name="notes"></textarea></label><button>إضافة عميل</button></form></section><section class="card"><table><thead><tr><th>الاسم</th><th>Telegram</th></tr></thead><tbody>{% for c in customers %}<tr><td>{{ c.display_name }}</td><td>{{ c.telegram_user_id or 'غير مربوط' }}</td></tr>{% else %}<tr><td colspan="2">لا يوجد عملاء</td></tr>{% endfor %}</tbody></table></section>{% endblock %}

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-code-delivery"
version = "0.1.0"
description = "Secure, entitlement-bound verification-code delivery for store-managed Steam accounts."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.36",
  "asyncpg==0.30.0",
  "psycopg[binary]==3.2.3",
  "alembic==1.14.0",
  "aiogram==3.17.0",
  "jinja2==3.1.5",
  "python-multipart==0.0.20",
  "pydantic-settings==2.7.0",
  "cryptography==44.0.0",
  "argon2-cffi==23.1.0",
  "email-validator==2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
  "httpx==0.28.1",
  "playwright==1.49.1",
  "ruff==0.8.4",
]

[project.scripts]
steam-codes = "app.cli:main"
steam-worker = "app.worker:main"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic"]
